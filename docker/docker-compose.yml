version: "3.9"
services:
  don_cad2real_docker:    
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - WS_DIR=${WS_DIR}
    
    user: "${UID:-1000}:${GID:-1000}"
    
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - WS_DIR=${WS_DIR}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    tty: true
    shm_size: '8gb'
    runtime: nvidia
    network_mode: host
    privileged: true

    volumes:
      - ../training_script.py:${WS_DIR}/training_script.py
      - ../dense_objects_nets:${WS_DIR}/dense_objects_nets
      - ../data:${WS_DIR}/data
      - ../config:${WS_DIR}/config
      - ../models:${WS_DIR}/models
      - ../runs:${WS_DIR}/runs
      - ../scripts:${WS_DIR}/scripts
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw