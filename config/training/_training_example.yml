# Base training parameters always required for a training run. If not specified default values are used.
base:
  num_epochs: -1 # Number of epochs. If '-1' the training will go on forever. Default: -1
  early_stopping_patience: null # Number of validation epochs with no improvement after which training will be stopped. Set to None to disable early stopping. Default: None
  epochs_between_learning_rate_decay: 100 # Rate (in epochs) at which optimizer parameters are scaled by 'learning_rate_decay'. Default: num_epochs + 1
  learning_rate_decay: 0.9 # Scaling factor for optimizer parameters. Default: 1.0 (i.e no decay).

  batch_size: 1 # Number of data samples per training batch. Default: 1
  num_workers: 0 # Number of subprocesses to use for data loading. 0 means that the data will be loaded in the main process. Default: 0
  pin_memory: true # If true the data loader will copy Tensors into CUDA pinned memory before returning them. Default: true
  prefetch_factor: 3 # Number of batches loaded in advance by each worker. Default: 3
  dataset_seed: null # Number used to seed the dataset random generators. Default: None (i.e no seeding).

  backup_rate: 1 # Number of training epochs between each model backup (if enabled). Default: 1
  validation_rate: 1 # Number of training epochs between each validation step. Default: 1
  evaluation_rate: 1 # Number of training epochs between each evaluation step. Default: 1
  num_validation_samples: 16 # Number of samples used to compute the avg validation loss at each validation step. Default: 16
  num_evaluation_samples: 16 # Number of samples used to compute the avg evaluation loss at each evaluation step. Default: 16
  keep_validation_and_evaluation_samples: true # If true validation and evaluation samples are computed at the beginning of training and then kept constant for the whole run.

  save_model: true # Wether we want to save the outputs of the training run. Default: true
  keep_all_backups: false # If 'true' all models are saved otherwise only the last and the best one are kept. Default: false

  log_outputs: true # If 'true' creates a TensorBoard log file to save the training metrics. Default: true
  logger_max_queue_size: 20 # Maximum size of the logger queue. Default: 20
  images_log_rate: 1 # Number of training iterations between each image log. Used to limit size of produced tfevents logs. Default: 1 
  outputs_path: ${WS_DIR}/runs/ # Path where the training run outputs are saved. Default: ${WS_DIR}/runs/


# ------------------------------------------------------------------------------ #


# The 'dataset', 'trainer', 'evaluator' and 'network' keys are used to configure the respective components of the used training pipeline.
# Parameters required under these keys depend on the selected implementations and are forwarded to the respective classes constructors.
dataset:
  # ...

trainer:
  # ...

evaluator:
  # ...

network:
  # ...

  # An 'optimizer' key is always required under 'network', if not present the below default parameters are used.
  optimizer:
    learning_rate: 1e-4 # Initial learning rate. Default: 1e-4
    weight_decay: 1e-5 # Weight decay (L2 penalty). Default: 1e-5